authentication:
  style: api-key-header
  header: secret-key
  notes: OpenAPI declares a single securityScheme APIKeyHeader (apiKey in header, name secret-key), applied
    to 127 of 184 operations. The SDK integration additionally uses an Access Key / Secret Key pair issued
    to the institute; the Access Key is passed to the browser SDK and the Secret Key is used server-side
    to sign the request hash.
  artifact: authentication/leo1-authentication.yml
request_signing:
  supported: true
  algorithm: SHA-512
  encoding: lowercase hex
  scheme: Pipe-delimited hash of ordered field values with the institute Secret Key appended.
  hash_sequence: key|total_fees|fees_paid|student_name|roll_number|branch_name|course_name|parent_name|institute_name|phone_number|erp_transaction_id
  field: hash
  rules:
  - All parameter values MUST be trimmed of leading and trailing whitespace before hashing.
  - Fields not supplied (e.g. branch_name, course_name) are represented as an empty string but still contribute
    their pipe separator.
  - The Secret Key is appended to the end of the hash string before hashing.
  docs: https://docs.leo1.in/integrations/server-integration
idempotency:
  supported: false
  evidence: No Idempotency-Key header or equivalent parameter appears in any of the 184 OpenAPI operations,
    and the SDK docs describe no retry-safety contract. The caller-supplied erp_transaction_id is a correlation
    identifier for the institute ERP transaction, not a documented idempotency key.
correlation:
  field: erp_transaction_id
  description: Institute-side ERP transaction identifier echoed through transaction creation, the payment-gateway
    webhook and the fee-finance webhook; used to reconcile a LEO1 transaction back to the institute ledger.
pagination:
  supported: false
  evidence: No page/limit/offset/cursor parameters are declared on the collection operations in the OpenAPI;
    listing endpoints (e.g. get_students_api_v1_student__get) take filter parameters and return full result
    sets. Bulk extracts are served through the download_* operations instead.
