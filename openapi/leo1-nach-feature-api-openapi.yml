components:
  schemas:
    UpdateNachConfigurationApplicable:
      title: UpdateNachConfigurationApplicable
      required:
      - institute_name
      - branch_name
      - is_active
      type: object
      properties:
        institute_name:
          title: Institute Name
          type: string
        branch_name:
          title: Branch Name
          type: string
        is_active:
          title: Is Active
          type: boolean
    NachBulkCommunication:
      title: NachBulkCommunication
      type: object
      properties:
        institute_ids:
          title: Institute Ids
          type: array
          items:
            type: integer
          default: []
        branch_ids:
          title: Branch Ids
          type: array
          items:
            type: integer
          default: []
        student_ids:
          title: Student Ids
          type: array
          items:
            type: integer
          default: []
    GenerateReport:
      title: GenerateReport
      required:
      - report_name
      - institute_ids
      type: object
      properties:
        report_name:
          title: Report Name
          type: string
          description: Report name is required
        institute_ids:
          title: Institute Ids
          type: array
          items:
            type: integer
          description: Institute IDs are required
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    EnachBody:
      title: EnachBody
      required:
      - student_uuid
      - authentication_mode
      type: object
      properties:
        student_uuid:
          title: Student Uuid
          type: string
        authentication_mode:
          title: Authentication Mode
          type: string
    EnachFeeSubscriptionRegistrationBody:
      title: EnachFeeSubscriptionRegistrationBody
      required:
      - student_id
      - created_by
      type: object
      properties:
        student_id:
          title: Student Id
          type: integer
        created_by:
          title: Created By
          type: string
        account_number:
          title: Account Number
          type: string
        ifsc_code:
          title: Ifsc Code
          type: string
        bank_code:
          title: Bank Code
          type: string
        account_type:
          title: Account Type
          type: string
        name_on_bank_account:
          title: Name On Bank Account
          type: string
    EnachRegistrationBody:
      title: EnachRegistrationBody
      required:
      - student_id
      - amount
      - created_by
      type: object
      properties:
        student_id:
          title: Student Id
          type: integer
        amount:
          title: Amount
          type: number
        created_by:
          title: Created By
          type: string
        account_number:
          title: Account Number
          type: string
        ifsc_code:
          title: Ifsc Code
          type: string
        bank_code:
          title: Bank Code
          type: string
        account_type:
          title: Account Type
          type: string
        name_on_bank_account:
          title: Name On Bank Account
          type: string
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    EnachPresentationBody:
      title: EnachPresentationBody
      required:
      - registration_id
      - debit_date
      - amount
      - created_by
      type: object
      properties:
        registration_id:
          title: Registration Id
          type: integer
        debit_date:
          title: Debit Date
          type: string
        amount:
          title: Amount
          type: integer
        created_by:
          title: Created By
          type: string
    B2CConsentData:
      title: B2CConsentData
      required:
      - student_uuid
      type: object
      properties:
        student_uuid:
          title: Student Uuid
          type: string
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: secret-key
