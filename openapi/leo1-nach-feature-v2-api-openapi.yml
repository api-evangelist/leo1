openapi: 3.0.2
info:
  title: leofees_backend api Nach Feature V2 API
  version: version
  description: General system endpoints for the API.
tags:
- name: Nach Feature V2
paths:
  /api/v2/nach/registration/request/:
    post:
      tags:
      - Nach Feature V2
      summary: Request Nach Registration
      operationId: request_nach_registration_api_v2_nach_registration_request__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnachBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
components:
  schemas:
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    EnachBody:
      title: EnachBody
      required:
      - student_uuid
      - authentication_mode
      type: object
      properties:
        student_uuid:
          title: Student Uuid
          type: string
        authentication_mode:
          title: Authentication Mode
          type: string
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: secret-key
