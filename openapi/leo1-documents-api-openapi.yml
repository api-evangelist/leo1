openapi: 3.2.0
info:
  title: leofees_backend Documents API
  version: version
tags:
- name: Documents
paths:
  /api/v1/documents/:
    get:
      tags:
      - Documents
      summary: Get Document
      operationId: get_document_api_v1_documents__get
      parameters:
      - required: true
        schema:
          title: Document Id
          type: integer
        name: document_id
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /api/v1/documents/response_file_manager:
    get:
      tags:
      - Documents
      summary: Get Response File Manager Data
      operationId: get_response_file_manager_data_api_v1_documents_response_file_manager_get
      parameters:
      - required: true
        schema:
          title: Institutes
          type: string
        name: institutes
        in: query
      - required: false
        schema:
          title: Branches
          type: string
          default: ''
        name: branches
        in: query
      - required: false
        schema:
          title: Limit
          type: integer
        name: limit
        in: query
      - required: false
        schema:
          title: Offset
          type: integer
        name: offset
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /api/v1/documents/download/response_file_manager:
    get:
      tags:
      - Documents
      summary: Download Response File Manager
      operationId: download_response_file_manager_api_v1_documents_download_response_file_manager_get
      parameters:
      - required: true
        schema:
          title: File Manager Id
          type: integer
        name: file_manager_id
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /api/v1/documents/delete/expired_file_manager_records:
    delete:
      tags:
      - Documents
      summary: Delete Expired File Manager Records
      operationId: delete_expired_file_manager_records_api_v1_documents_delete_expired_file_manager_records_delete
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - APIKeyHeader: []
components:
  schemas:
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: secret-key
