aid: leo1
name: Leo1
description: 'LEO1 is a Mumbai-based education fintech founded in 2017 that operates an all-in-one campus
  and financial platform for Indian educational institutions. The company issues co-branded student and
  alumni prepaid cards, collects and reconciles institutional fees, and originates fee-financing (education
  loan) journeys that convert lump-sum tuition into instalments while giving institutes regularized cash
  flow. LEO1 exposes the LEO1 Fees SDK — a documented server-to-server and web checkout integration that
  lets an institute ERP start a fee transaction, embed the hosted checkout, and receive payment-gateway
  and fee-finance webhook notifications — backed by a public OpenAPI 3.0.2 description covering student,
  fee-due, fee-collection, payment, NACH/eNACH mandate, refund, penalty, waiver, settlement and institute
  administration operations. Backed by QED Investors, LEO1 reports partnerships with 31+ institution groups
  serving over half a million students across India.'
